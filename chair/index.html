const NV = VERTS.length / 3;
const W = 78, H = 56, SS = 2;
const HW = W * SS, HH = H * SS;
const RAMP = " .,:;irsXA253hMHGS#9B&@";
const LX = 0.4767, LY = 0.6674, LZ = -0.5721;   // normalized light dir

const scr = document.getElementById('scr');
const stage = document.getElementById('stage');

const zbuf = new Float32Array(HW * HH);
const img = new Float32Array(HW * HH);
const sx = new Float32Array(NV), sy = new Float32Array(NV);
const px_ = new Float32Array(NV), py_ = new Float32Array(NV), pz_ = new Float32Array(NV);

function render(yaw, tilt) {
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const ppuY = (H - 1) / 2.42, ppuX = ppuY * 2;
  for (let i = 0; i < NV; i++) {
    const vx = VERTS[3*i], vy = VERTS[3*i+1], vz = VERTS[3*i+2];
    const x = vx * ca - vy * sa;
    const y = vx * sa + vy * ca;
    const yv = y * ct - vz * st;
    const zv = y * st + vz * ct;
    px_[i] = x; py_[i] = zv; pz_[i] = yv;
    sx[i] = (W / 2 + x * ppuX) * SS;
    sy[i] = ((H - 1) / 2 - zv * ppuY) * SS;
  }
  zbuf.fill(1e9); img.fill(0);
  for (let t = 0; t < TRIS.length; t += 3) {
    const a = TRIS[t], b = TRIS[t+1], c = TRIS[t+2];
    const e1x = px_[b]-px_[a], e1y = py_[b]-py_[a], e1z = pz_[b]-pz_[a];
    const e2x = px_[c]-px_[a], e2y = py_[c]-py_[a], e2z = pz_[c]-pz_[a];
    let nx = e1y*e2z - e1z*e2y, ny = e1z*e2x - e1x*e2z, nz = e1x*e2y - e1y*e2x;
    const nn = Math.sqrt(nx*nx + ny*ny + nz*nz);
    if (nn < 1e-12) continue;
    const lum = Math.abs((nx*LX + ny*LY + nz*LZ) / nn);
    const ax = sx[a], ay = sy[a], ad = pz_[a];
    const bx = sx[b], by = sy[b], bd = pz_[b];
    const cx = sx[c], cy = sy[c], cd = pz_[c];
    // vertex splats catch sub-pixel geometry
    for (const [vx2, vy2, vd2] of [[ax,ay,ad],[bx,by,bd],[cx,cy,cd]]) {
      const ix = vx2 | 0, iy = vy2 | 0;
      if (ix >= 0 && ix < HW && iy >= 0 && iy < HH) {
        const k = iy * HW + ix;

      }
    }
    const x0 = Math.max(Math.min(ax,bx,cx) | 0, 0), x1 = Math.min((Math.max(ax,bx,cx) | 0) + 1, HW);
    const y0 = Math.max(Math.min(ay,by,cy) | 0, 0), y1 = Math.min((Math.max(ay,by,cy) | 0) + 1, HH);

    const d0 = (by-cy)*(ax-cx) + (cx-bx)*(ay-cy);
    if (Math.abs(d0) < 1e-12) continue;
    for (let yy = y0; yy < y1; yy++) {
      const yc = yy + 0.5;
      for (let xx = x0; xx < x1; xx++) {
        const xc = xx + 0.5;
        const w0 = ((by-cy)*(xc-cx) + (cx-bx)*(yc-cy)) / d0;
        const w1 = ((cy-ay)*(xc-cx) + (ax-cx)*(yc-cy)) / d0;
        const w2 = 1 - w0 - w1;
        if (w0 < -0.05 || w1 < -0.05 || w2 < -0.05) continue;
        const dep = w0*ad + w1*bd + w2*cd;
        const k = yy * HW + xx;
        if (dep < zbuf[k]) { zbuf[k] = dep; img[k] = lum; }
      }
    }
  }
  const lines = [];
  for (let cyy = 0; cyy < H; cyy++) {
    let line = '';
    for (let cxx = 0; cxx < W; cxx++) {
      let best = 1e9, lum = 0, cov = 0;
      for (let dy = 0; dy < SS; dy++) for (let dx = 0; dx < SS; dx++) {
        const k = (cyy*SS+dy) * HW + (cxx*SS+dx);
        if (zbuf[k] < 1e9) { cov++; if (zbuf[k] < best) { best = zbuf[k]; lum = img[k]; } }

      const v = lum * (0.45 + 0.55 * cov / (SS*SS));
      line += RAMP[Math.min((v * (RAMP.length - 1) | 0) + 1, RAMP.length - 1)];

function start() { clearInterval(timer); timer = setInterval(() => { yaw += 2*Math.PI/48; render(yaw, tilt); }, 110); }
function stop() { clearInterval(timer); }

let drag = null;

  drag = { x: e.clientX, y: e.clientY, yaw, tilt };
  stop();
  stage.setPointerCapture(e.pointerId);

  if (!drag) return;
  yaw = drag.yaw + (e.clientX - drag.x) * 0.015;
  tilt = Math.max(-Math.PI/2, Math.min(Math.PI/2, drag.tilt - (e.clientY - drag.y) * 0.012));
  render(yaw, tilt);
});
stage.addEventListener('pointerup', () => { drag = null; if (spinning) start(); });

render(yaw, tilt);
if (spinning) start();
